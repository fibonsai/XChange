name: Deploy artifacts

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        ref: 'fibonsai-develop'

    - name: Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Publish to GitHub Packages Apache Maven
      run: mvn -B -N package deploy -DskipTests -Dmaven.javadoc.skip -DskipIntegrationTests -Dfmt.skip=true --settings etc/settings-fibonsai.xml;
      env:
        GITHUB_TOKEN: ${{ secrets.CI_DEPLOY_PASSWORD }}
